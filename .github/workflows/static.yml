function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function nowLocalDatetime() {
  const d = new Date();
  d.setSeconds(0, 0);
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 16);
}

function fmt(dtStr) {
  if (!dtStr) return "—";
  try {
    const d = new Date(dtStr);
    if (isNaN(d.getTime())) return dtStr;
    return d.toLocaleString("zh-TW", {
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false,
    });
  } catch {
    return dtStr;
  }
}

// Formats a stored "YYYY-MM-DDTHH:mm" value as "YYYY-MM-DD HH:MM" — the same plain-text
// format used by the import template, so an exported file can be edited and re-imported.
function toImportDateFormat(dtStr) {
  if (!dtStr) return "";
  return String(dtStr).replace("T", " ").slice(0, 16);
}

// ---------- Excel import helpers ----------
const IMPORT_COLUMNS = {
  poName: ["郵局局名"],
  poCode: ["局號(6碼數字)", "局號"],
  machineNo: ["機號(3碼英數字)", "機號"],
  machineType: ["機種"],
  vendor: ["廠商名稱"],
  issueTime: ["問題發生時間點(YYYY-MM-DD HH:MM)", "問題發生時間點", "問題發生時間"],
  description: ["問題描述"],
  vendorAnalysis: ["廠商分析"],
  resolveTime: ["解決時間/預期解決時間(YYYY-MM-DD HH:MM)", "解決時間/預期解決時間", "解決時間"],
  solution: ["解決方法"],
  status: ["目前狀態", "狀態"],
};

function pickColumn(row, keys) {
  for (const k of keys) {
    if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== "") {
      return row[k];
    }
  }
  return "";
}

function normalizeCode(val) {
  if (val === undefined || val === null) return "";
  let s = String(val).trim();
  if (/^\d+(\.0+)?$/.test(s)) s = s.replace(/\.0+$/, "");
  return s;
}

function padCode(s, len) {
  if (/^\d+$/.test(s) && s.length < len) return s.padStart(len, "0");
  return s;
}

function formatImportedDateTime(val) {
  if (!val) return "";
  if (val instanceof Date && !isNaN(val.getTime())) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${val.getFullYear()}-${pad(val.getMonth() + 1)}-${pad(val.getDate())}T${pad(val.getHours())}:${pad(val.getMinutes())}`;
  }
  let s = String(val).trim();
  if (!s) return "";
  s = s.replace(" ", "T");
  return s.slice(0, 16);
}

function parseImportRow(row, rowIndex) {
  const poName = String(pickColumn(row, IMPORT_COLUMNS.poName)).trim();
  let poCode = normalizeCode(pickColumn(row, IMPORT_COLUMNS.poCode));
  poCode = padCode(poCode, 6);
  let machineNo = String(pickColumn(row, IMPORT_COLUMNS.machineNo)).trim().toUpperCase();
  const machineType = String(pickColumn(row, IMPORT_COLUMNS.machineType)).trim();
  const vendor = String(pickColumn(row, IMPORT_COLUMNS.vendor)).trim();
  const issueTime = formatImportedDateTime(pickColumn(row, IMPORT_COLUMNS.issueTime));
  const description = String(pickColumn(row, IMPORT_COLUMNS.description)).trim();
  const vendorAnalysis = String(pickColumn(row, IMPORT_COLUMNS.vendorAnalysis)).trim();
  const resolveTime = formatImportedDateTime(pickColumn(row, IMPORT_COLUMNS.resolveTime));
  const solution = String(pickColumn(row, IMPORT_COLUMNS.solution)).trim();
  let status = String(pickColumn(row, IMPORT_COLUMNS.status)).trim();
  if (!STATUS_LIST.includes(status)) status = STATUS.PENDING;

  const isBlank = !poName && !poCode && !machineNo && !description;

  const errors = [];
  if (!poName) errors.push("缺少郵局局名");
  if (!/^\d{6}$/.test(poCode)) errors.push("局號需為6碼數字");
  if (!/^[A-Za-z0-9]{3}$/.test(machineNo)) errors.push("機號需為3碼英數字");
  if (!issueTime) errors.push("缺少問題發生時間");
  if (!description) errors.push("缺少問題描述");

  return {
    rowIndex, isBlank,
    poName, poCode, machineNo, machineType, vendor,
    issueTime, description, vendorAnalysis, resolveTime, solution, status,
    errors, valid: errors.length === 0,
  };
}

// Composite key used to detect duplicate cases: same post office code + machine number
// + occurrence time uniquely identifies one anomaly case. When time is missing, fall back
// to the start of the description as a best-effort fingerprint.
function buildDedupeKey(c) {
  const code = (c.poCode || "").trim();
  const machine = (c.machineNo || "").trim().toUpperCase();
  const time = (c.issueTime || "").trim();
  const descFingerprint = (c.description || "").trim().slice(0, 20);
  return `${code}|${machine}|${time || descFingerprint}`;
}

