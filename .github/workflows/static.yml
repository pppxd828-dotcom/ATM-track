function CaseForm({ initial, onCancel, onSubmit, submitLabel }) {
  const [form, setForm] = useState(
    initial || {
      poName: "",
      poCode: "",
      machineNo: "",
      machineType: MACHINE_TYPES[0],
      vendor: VENDORS[0],
      issueTime: nowLocalDatetime(),
      description: "",
      vendorAnalysis: "",
      resolveTime: "",
      solution: "",
      status: STATUS.PENDING,
    }
  );
  const [errors, setErrors] = useState({});

  const update = (key, val) => setForm((f) => ({ ...f, [key]: val }));

  const validate = () => {
    const e = {};
    if (!form.poName.trim()) e.poName = "請輸入郵局局名";
    if (!/^\d{6}$/.test(form.poCode)) e.poCode = "局號須為 6 碼數字";
    if (!/^[A-Za-z0-9]{3}$/.test(form.machineNo)) e.machineNo = "機號須為 3 碼英數字（例如 1J1）";
    if (!form.vendor) e.vendor = "請選擇廠商名稱";
    if (!form.issueTime) e.issueTime = "請選擇問題發生時間";
    if (!form.description.trim()) e.description = "請輸入問題描述";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = () => {
    if (!validate()) return;
    onSubmit({ ...form, machineNo: form.machineNo.toUpperCase() });
  };

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="郵局局名" required error={errors.poName} icon={Building2}>
          <input
            className={inputBase}
            placeholder="例如：台北中山路郵局"
            value={form.poName}
            onChange={(e) => update("poName", e.target.value)}
          />
        </Field>
        <Field label="局號" required error={errors.poCode} icon={Hash}>
          <input
            className={inputBase}
            placeholder="6 碼數字"
            maxLength={6}
            value={form.poCode}
            onChange={(e) => update("poCode", e.target.value.replace(/\D/g, "").slice(0, 6))}
          />
        </Field>
        <Field label="機號" required error={errors.machineNo} icon={Cpu}>
          <input
            className={inputBase}
            placeholder="例如：1J1"
            maxLength={3}
            value={form.machineNo}
            onChange={(e) => update("machineNo", e.target.value.replace(/[^A-Za-z0-9]/g, "").slice(0, 3))}
          />
        </Field>
        <Field label="機種" required error={errors.machineType} icon={HardDrive}>
          <select
            className={inputBase}
            value={form.machineType}
            onChange={(e) => update("machineType", e.target.value)}
          >
            {MACHINE_TYPES.map((m) => (
              <option key={m} value={m}>{m}</option>
            ))}
          </select>
        </Field>
        <Field label="廠商名稱" required error={errors.vendor} icon={Truck}>
          <div className="flex items-center gap-2">
            <select
              className={inputBase}
              value={form.vendor}
              onChange={(e) => update("vendor", e.target.value)}
            >
              {VENDORS.map((v) => (
                <option key={v} value={v}>{v}</option>
              ))}
            </select>
            <span className={`shrink-0 w-3 h-3 rounded-full ${(VENDOR_STYLE[form.vendor] || DEFAULT_VENDOR_STYLE).dot}`} />
          </div>
        </Field>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="問題發生時間點" required error={errors.issueTime} icon={Calendar}>
          <input
            type="datetime-local"
            className={inputBase}
            value={form.issueTime}
            onChange={(e) => update("issueTime", e.target.value)}
          />
        </Field>
        <Field label="目前狀態" icon={ShieldCheck}>
          <select
            className={inputBase}
            value={form.status}
            onChange={(e) => update("status", e.target.value)}
          >
            {STATUS_LIST.map((s) => (
              <option key={s} value={s}>{s}</option>
            ))}
          </select>
        </Field>
      </div>

      <Field label="問題描述" required error={errors.description} icon={FileText}>
        <textarea
          className={inputBase + " min-h-[80px] resize-y"}
          placeholder="描述客戶反映或系統偵測到的異常現象"
          value={form.description}
          onChange={(e) => update("description", e.target.value)}
        />
      </Field>

      <Field label="廠商分析" icon={ClipboardList}>
        <textarea
          className={inputBase + " min-h-[70px] resize-y"}
          placeholder="（選填）廠商初步或後續分析內容"
          value={form.vendorAnalysis}
          onChange={(e) => update("vendorAnalysis", e.target.value)}
        />
      </Field>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="解決時間／預期解決時間" icon={Clock}>
          <input
            type="datetime-local"
            className={inputBase}
            value={form.resolveTime}
            onChange={(e) => update("resolveTime", e.target.value)}
          />
        </Field>
      </div>

      <Field label="解決方法" icon={Wrench}>
        <textarea
          className={inputBase + " min-h-[70px] resize-y"}
          placeholder="（選填）已採取或預計採取的解決方式"
          value={form.solution}
          onChange={(e) => update("solution", e.target.value)}
        />
      </Field>

      <div className="flex items-center justify-end gap-3 pt-2 border-t border-slate-100">
        <button
          onClick={onCancel}
          className="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition-colors"
        >
          取消
        </button>
        <button
          onClick={handleSubmit}
          className="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-semibold text-white bg-blue-700 hover:bg-blue-800 rounded-lg shadow-sm transition-colors"
        >
          <Save size={15} />
          {submitLabel}
        </button>
      </div>
    </div>
  );
}

